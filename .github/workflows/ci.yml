name: CI

on:
  push:
    branches: [main]
  pull_request:

# Allow one deploy at a time, and let a newer push supersede a queued one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lint, format, types and unit tests across every package.
      - run: pnpm checks

      - run: pnpm --filter @janggi/webapp compile

      # Work not yet in production must not be in a production build. Stops the deploy if it is.
      - run: pnpm --filter @janggi/webapp check:unreleased

  # The work not yet in production, on a build compiled with it. Goes red on failure but nothing `needs` it, so
  # half-built work never holds up a release. Add it to no required checks.
  unreleased:
    name: Acceptance tests (unreleased work)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @janggi/acceptance-tests exec playwright install --with-deps chromium

      - run: pnpm --filter @janggi/webapp compile
        env:
          VITE_UNRELEASED: "true"

      - name: Serve the build
        run: pnpm --filter @janggi/webapp preview &

      - name: Wait for the server
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3000 >/dev/null && exit 0
            sleep 1
          done
          echo "The preview server never came up" >&2
          exit 1

      - run: pnpm acceptance-tests:unreleased

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-unreleased
          path: acceptance-tests/playwright-report/
          retention-days: 7

  acceptance-tests:
    name: Acceptance tests (local)
    runs-on: ubuntu-latest
    # The suite is split across runners rather than run with more workers on one: each shard keeps
    # Playwright's two workers on its own four vCPUs, so the 5s action and expect timeouts see no
    # extra contention. The shard count is the length of this list.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --with-deps installs the system libraries Chromium needs on a bare runner.
      - run: pnpm --filter @janggi/acceptance-tests exec playwright install --with-deps chromium

      # Test the production build, not the dev server.
      - run: pnpm --filter @janggi/webapp compile

      - name: Serve the build
        run: pnpm --filter @janggi/webapp preview &

      - name: Wait for the server
        run: |
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3000 >/dev/null && exit 0
            sleep 1
          done
          echo "The preview server never came up" >&2
          exit 1

      - run: pnpm acceptance-tests --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Release updates need the production service worker, which the ordinary dev-server suite does
      # not register. This is deterministic and gates the deploy with the rest of the acceptance tests.
      # A dozen specs, so it runs on the first shard only rather than on every one.
      - if: matrix.shard == 1
        run: pnpm acceptance-tests:pwa

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-local-${{ matrix.shard }}
          path: acceptance-tests/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: [checks, acceptance-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      page-url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # The whole history, because the sitemap dates each page by the last commit that changed it
      # (`webapp/vite/sitemap/DatedSitemapFile.ts`); a one-commit checkout would date every page today.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The custom domain (janggi.neilarmstrong.dev, set in the repository's Pages settings) serves
      # the site from its root, so the base is "/" and matches the build the tests ran against.
      - name: Build for Pages
        run: pnpm --filter @janggi/webapp compile
        env:
          BASE_PATH: /

      # Checked again here because this is the build that ships.
      - run: pnpm --filter @janggi/webapp check:unreleased

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: webapp/build

      - id: deployment
        uses: actions/deploy-pages@v5

  # Tells Bing, Naver, Yandex and the other IndexNow engines which pages have just changed, so they come back
  # sooner than their crawlers would. Google does not take part. It only names pages the sitemap dates in the last
  # two days — IndexNow asks for changed pages, never the whole site — and it gates nothing: a ping that fails is
  # a missed hint, not a broken release. The key file is `webapp/public/<key>.txt`; `docs/seo.md` has why.
  notify-search-engines:
    name: Tell search engines what changed
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Ping IndexNow
        run: |
          set -euo pipefail
          site="${WEBAPP_URL%/}"
          key_file=$(ls webapp/public | grep -E '^[0-9a-f]{32}\.txt$' | head -n 1)
          key="${key_file%.txt}"

          # The key file is what proves the site is ours, so it has to be there before the ping.
          for _ in $(seq 1 60); do
            curl -sf "$site/$key_file" >/dev/null && break
            sleep 5
          done

          since=$(date -u -d '2 days ago' +%F)
          changed=$(curl -sf "$site/sitemap.xml" \
            | tr -d '\n' \
            | grep -oE '<loc>[^<]*</loc>[[:space:]]*<lastmod>[^<]*</lastmod>' \
            | sed -E 's|<loc>([^<]*)</loc>[[:space:]]*<lastmod>([^<]*)</lastmod>|\2 \1|' \
            | awk -v since="$since" '$1 >= since { print $2 }')

          if [ -z "$changed" ]; then
            echo "No page changed since $since; nothing to tell search engines."
            exit 0
          fi

          echo "Telling search engines about:"
          echo "$changed"

          body=$(printf '%s\n' "$changed" | jq -R . | jq -s \
            --arg host "${site#https://}" \
            --arg key "$key" \
            --arg keyLocation "$site/$key_file" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: .}')

          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$body" \
            --fail-with-body
        env:
          WEBAPP_URL: ${{ needs.deploy.outputs.page-url }}

  deploy-api:
    name: Deploy the API to Cloudflare
    needs: [checks, acceptance-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Inert until the owner has added the secrets (infra/AGENTS.md): a secret cannot be tested in an `if`, so the step looks
      # for itself. Once the token is there, an API that cannot be deployed fails the build rather than being skipped.
      # Alchemy creates or adopts the D1 database by name, applies its migrations, and deploys the Worker — the same run
      # on a fresh account as on this one. It deliberately keeps no state between CI runs for now; the safer replacement
      # and the limitations accepted here are recorded in docs/alchemy-state.md.
      - name: Deploy the API with Alchemy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN: the API is not deployed."
            exit 0
          fi
          pnpm --filter @janggi/infra provision
        env:
          # Temporary escape hatch: replace with the persistent store described in docs/alchemy-state.md.
          ALCHEMY_CI_STATE_STORE_CHECK: "false"
          ALCHEMY_TELEMETRY_DISABLED: 1
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}

  acceptance-tests-production:
    name: Acceptance tests (production)
    needs: deploy
    runs-on: ubuntu-latest
    # Sharded like the local job, and this is the one that gains most: every spec's fresh browser
    # context downloads the site and waits for its service worker to isolate the page (`docs/bot.md`),
    # so the run is bound by latency, not CPU.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @janggi/acceptance-tests exec playwright install --with-deps chromium

      # Pages can serve the previous build for a moment after the deployment reports success.
      - name: Wait for the deployment
        run: |
          for _ in $(seq 1 60); do
            curl -sf "$WEBAPP_URL" >/dev/null && exit 0
            sleep 5
          done
          echo "$WEBAPP_URL never came up" >&2
          exit 1
        env:
          WEBAPP_URL: ${{ needs.deploy.outputs.page-url }}

      # The deployed URL, rather than the one baked into the :production script.
      - run: pnpm acceptance-tests --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        env:
          WEBAPP_URL: ${{ needs.deploy.outputs.page-url }}

      - if: matrix.shard == 1
        run: pnpm acceptance-tests:pwa
        env:
          WEBAPP_URL: ${{ needs.deploy.outputs.page-url }}

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-production-${{ matrix.shard }}
          path: acceptance-tests/playwright-report/
          retention-days: 7
