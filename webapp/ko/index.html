    <style>

      main[data-crawler-copy] {

        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>

    <title>장기 온라인 무료 게임 · 친구 또는 AI와 대국</title>

  <body>
    <div id="root">
      <!-- What a crawler that runs no scripts reads. React replaces it as soon as the app mounts. -->
      <main data-crawler-copy>
        <h1>장기 온라인 게임</h1>
        <p>
          장기를 친구와 비밀 코드로 온라인에서 두거나, 8단계 AI와 대국하세요. 무료입니다. 친구와 두려면 Google 로그인이
